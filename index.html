<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Club FC</title>
<style>
:root{
  --bg:#0e0f12;--panel:#17191e;--panel2:#1f2228;--line:#2a2e36;--text:#eef0f3;--mute:#8b919c;
  --accent:#3b4cff;--accent2:#5865ff;--green:#22c55e;--lime:#a3e635;--yellow:#facc15;--orange:#fb923c;--red:#ef4444;
  --r0:#6b7280;--r1:#22c55e;--r2:#3b82f6;--r3:#a855f7;--r4:#f59e0b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
header.top{position:sticky;top:0;z-index:5;background:rgba(14,15,18,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.crest{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;border:3px solid;flex:none}
.top .club{flex:1;min-width:0}
.top .club b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .club small{color:var(--mute);font-size:11px}
.chip{background:var(--panel2);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;white-space:nowrap}
main#view{flex:1;padding:14px 16px 90px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(6,1fr);background:#121418;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{padding:9px 0 8px;font-size:10px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:#fff;background:linear-gradient(180deg,rgba(59,76,255,.35),transparent)}
nav.tabs svg{width:20px;height:20px}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mute{color:var(--mute)}
.btn{background:var(--accent);color:#fff;font-weight:700;border-radius:10px;padding:11px 14px;text-transform:uppercase;font-size:13px;letter-spacing:.03em}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--panel2)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.full{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
.r0{background:rgba(107,114,128,.25);color:#cbd0d8}.r1{background:rgba(34,197,94,.18);color:#4ade80}.r2{background:rgba(59,130,246,.2);color:#7cb1ff}.r3{background:rgba(168,85,247,.22);color:#d0a6ff}.r4{background:rgba(245,158,11,.22);color:#fbbf24}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;border:2.5px solid;flex:none}
.plist .pl{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.pl .nm{flex:1;min-width:0}
.pl .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.pl .nm small{color:var(--mute);font-size:11px}
.rat{font-weight:800;font-size:16px;width:30px;text-align:center}
.cond{font-size:11px;font-weight:700;width:44px;text-align:right}
.pos{font-size:10px;font-weight:800;padding:3px 6px;border-radius:6px;color:#0b0c0e;min-width:30px;text-align:center}
.f5{background:#22c55e}.f4{background:#a3e635}.f3{background:#facc15}.f2{background:#fb923c}.f1{background:#ef4444}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--mute);font-size:10px;text-transform:uppercase;text-align:right;padding:6px 4px;font-weight:700}
.tbl td{padding:7px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl td:nth-child(2),.tbl th:nth-child(2){text-align:left}
.tbl tr.me td{background:rgba(59,76,255,.14);font-weight:700}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 2px;border-radius:8px;font-size:11px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--accent);color:#fff}
.mini-pitch{position:relative;background:linear-gradient(#2e8b3d,#277a35);border-radius:12px;aspect-ratio:68/80;overflow:hidden;border:2px solid #3a9a4a}
.mini-pitch:before{content:"";position:absolute;left:28%;right:28%;top:-1px;height:14%;border:2px solid rgba(255,255,255,.5);border-top:0}
.mini-pitch:after{content:"";position:absolute;left:28%;right:28%;bottom:-1px;height:14%;border:2px solid rgba(255,255,255,.5);border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:70px}
.slot .num{width:34px;height:34px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.slot .lbl{font-size:10px;font-weight:700;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:5px;max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .empty{width:34px;height:34px;border-radius:50%;border:2px dashed rgba(255,255,255,.6);display:grid;place-items:center;font-size:10px;font-weight:800}
.slot .fitdot{position:absolute;top:-2px;right:14px;width:11px;height:11px;border-radius:50%;border:2px solid #111}
.slot .ins{font-size:9px;color:#fff;opacity:.85}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#444;margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#262a33;padding:10px 14px;border-radius:10px;z-index:40;font-weight:600;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);border-radius:10px;padding:8px}
.stat small{color:var(--mute);font-size:10px;text-transform:uppercase;display:block}
.stat b{font-size:17px}
/* match */
#match{position:fixed;inset:0;background:#0b0c0e;z-index:15;display:none;flex-direction:column;max-width:520px;margin:0 auto}
#match.on{display:flex}
.sb{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px;background:#121418;border-bottom:1px solid var(--line)}
.sb .tm{display:flex;align-items:center;gap:6px;font-weight:800;width:90px}
.sb .tm.r{justify-content:flex-end}
.sb .score{font-size:24px;font-weight:900;letter-spacing:.04em;min-width:76px;text-align:center}
.sb .clock{font-size:12px;color:var(--lime);font-weight:800;text-align:center}
.kdot{width:16px;height:16px;border-radius:50%;border:3px solid}
#pitchWrap{flex:1;position:relative;min-height:0}
#pitch{position:absolute;inset:0;width:100%;height:100%;display:block}
.mctl{background:#121418;border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.ticker{font-size:12px;min-height:34px;color:#cfd3da}
.ticker div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker .g{color:var(--lime);font-weight:700}
.mstats{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin:4px 0 6px}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;z-index:3}
.overlay h1{margin:0;font-size:28px}
.goalflash{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:44px;font-weight:900;letter-spacing:.1em;pointer-events:none;text-shadow:0 4px 20px rgba(0,0,0,.6);animation:pop 1.6s ease forwards}
@keyframes pop{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.15);opacity:1}70%{opacity:1}100%{transform:scale(1);opacity:0}}
/* player card */
.pcard{border-radius:16px;padding:14px;background:linear-gradient(160deg,#1d3b2a,#151a1f 60%);border:2px solid var(--line)}
.pcard.rr1{border-color:#22c55e}.pcard.rr2{border-color:#3b82f6}.pcard.rr3{border-color:#a855f7;box-shadow:0 0 24px rgba(168,85,247,.35)}.pcard.rr4{border-color:#f59e0b;box-shadow:0 0 30px rgba(245,158,11,.45)}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.attrs div{background:rgba(0,0,0,.25);border-radius:8px;padding:6px 8px;display:flex;justify-content:space-between;font-size:12px}
.attrs b{font-size:13px}
.fitmap{position:relative;aspect-ratio:68/80;background:#1b4d2a;border-radius:10px;border:1px solid #2f6b3f}
.fitmap span{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;border:2.5px solid;background:#13161a}
.stars{color:#fbbf24;letter-spacing:1px}
.reveal{animation:flip .9s ease}
@keyframes flip{0%{transform:rotateY(90deg) scale(.7);opacity:0}60%{transform:rotateY(-8deg) scale(1.04);opacity:1}100%{transform:none}}
.kits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kits button{border-radius:10px;padding:8px 4px;background:var(--panel2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;color:var(--mute)}
.kits button.on{border-color:#fff;color:#fff}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
label.f{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;margin:12px 0 5px;font-weight:700}
.odds{width:100%;font-size:12px;border-collapse:collapse;margin-top:8px}
.odds td{padding:4px 2px;border-top:1px solid var(--line)}
.odds td:last-child{text-align:right;font-weight:700}
.news div{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.news small{color:var(--mute)}
.ava{border-radius:50%;display:grid;place-items:center;border:2.5px solid;flex:none}
.hbtn{width:20px;height:20px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--mute);font-size:11px;font-weight:800;line-height:1;vertical-align:middle;flex:none}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:496px;background:#1d2130;border:1px solid var(--lime);border-radius:14px;padding:12px;z-index:19;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tipIn .3s ease}
@keyframes tipIn{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.askbtn{position:fixed;right:max(14px,calc(50% - 246px));bottom:calc(72px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;font-size:22px;z-index:7;box-shadow:0 6px 18px rgba(0,0,0,.5);border:2.5px solid}
.faq{border-top:1px solid var(--line);padding:9px 2px}.faq summary{font-weight:700;font-size:14px;cursor:pointer}
.hb p,.hb li{font-size:14px;line-height:1.55;color:#d6d9df}.hb ul,.hb ol{padding-left:20px}
.moneybar{display:grid;grid-template-columns:1fr 1fr .7fr;gap:6px;padding:8px 16px;background:#121418;border-bottom:1px solid var(--line);position:sticky;top:55px;z-index:4}
.moneybar button{background:var(--panel2);border-radius:9px;padding:5px 8px;text-align:left;display:flex;flex-direction:column}
.moneybar small{font-size:9.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}.moneybar b{font-size:14px}
</style>
</head>

// ---------- players ----------
function fitGrade(p,pos){
  if(!p) return 0;
  let g;
  if(p.pos===pos) g=5;
  else if(pos==='GK'||p.pos==='GK') g=1;
  else if(p.sec.includes(pos)) g=4;
  else{const a=POS[p.pos],b=POS[pos];const d=Math.hypot((a[0]-b[0])*.6,a[1]-b[1]);g=d<.17?4:d<.3?3:d<.45?2:1}
  return Math.min(5,g+(p.fitB[pos]||0));
}
function genPlayer(gender,pos,rar,o={}){
  const pool=o.pool||pickPool();const [fn,ln,flag,town]=genName(pool,gender);
  const band=RBAND[rar];const rating=clamp(ri(band[0],band[1])+(o.shift||0),18,90);
  const pot=clamp(rating+Math.round(ri(4,12)*(1+rar*.3)),rating,95);
  const prof=PROFILE[pos];const attrs={};
  for(const a of ['pac','sho','pas','dri','def','phy','gk']) attrs[a]=clamp(rating+(prof[a]||0)+ri(-4,4)+(a==='gk'&&pos!=='GK'?-25:0),5,99);
  const sec=[];
  if(pos!=='GK'){const c=POS_ORDER.filter(q=>q!==pos&&q!=='GK').filter(q=>{const a=POS[pos],b=POS[q];return Math.hypot((a[0]-b[0])*.6,a[1]-b[1])<.3});
    const n=ri(0,2);for(let i=0;i<n&&c.length;i++)sec.push(c.splice(Math.floor(R()*c.length),1)[0]);}
  return {id:uid(),fn,ln,pool,flag,town,pos,sec,rar,rating,pot,attrs,sta:clamp(ri(50,85)+rar*2,40,99),lead:ri(40,85),gpa:+(2.2+R()*1.8).toFixed(2),
    cond:100,year:o.year||ri(1,4),stars:0,num:0,fitB:{},st:{apps:0,goals:0,mins:0}};
}
const SQUAD_POS=['GK','GK','CB','CB','CB','LB','RB','DM','CM','CM','CM','LM','RM','AM','LW','RW','ST','ST'];
function assignNums(sq){const used=new Set(sq.filter(p=>p.num).map(p=>p.num));
  for(const p of sq){if(p.num)continue;const pref=p.pos==='GK'?[1,13,23,30]:p.pos==='ST'?[9,19,20,11]:[];let n=pref.find(x=>!used.has(x));
    if(!n){n=2;while(used.has(n))n++}p.num=n;used.add(n)}}
function genSquad(gender,shift,rars){const sq=SQUAD_POS.map((pos,i)=>genPlayer(gender,pos,rars?rars[i]:(R()<.15?1:0),{shift}));assignNums(sq);return sq}

// ---------- tactics ----------
function slotScore(p,pos){return p.rating*FIT_MULT[fitGrade(p,pos)]*condFactor(p.cond)}
function autopick(squad,formation){
  const slots=FORMATIONS[formation];const used=new Set();const lineup=Array(11).fill(null);
  const order=slots.map((s,i)=>i).sort((a,b)=>(slots[a].pos==='GK'?-1:0)-(slots[b].pos==='GK'?-1:0));
  for(const i of order){let best=null,bs=-1;for(const p of squad){if(used.has(p.id)||p.cond<25)continue;const sc=slotScore(p,slots[i].pos);if(sc>bs){bs=sc;best=p}}
    if(best){used.add(best.id);lineup[i]=best.id}}
  return lineup;
}

function roundRobin(ids){const n=ids.length,a=ids.slice(),rounds=[];
  for(let r=0;r<n-1;r++){const rd=[];for(let i=0;i<n/2;i++){const h=a[i],w=a[n-1-i];rd.push(r%2?[w,h]:[h,w])}rounds.push(rd);a.splice(1,0,a.pop())}
  return rounds.concat(rounds.map(rd=>rd.map(([h,w])=>[w,h])));}
function table(st){const rows={};for(const t of st.teams)rows[t.id]={id:t.id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  for(const rd of st.fixtures)for(const f of rd){if(f.hs==null)continue;const h=rows[f.h],a=rows[f.a];h.p++;a.p++;h.gf+=f.hs;h.ga+=f.as;a.gf+=f.as;a.ga+=f.hs;
    if(f.hs>f.as){h.w++;a.l++;h.pts+=3}else if(f.hs<f.as){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}}
  return Object.values(rows).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);}

// ---------- match engine ----------
const PW=68,PL=105,HALF=600;
function eff(m,e,a){return e.p.attrs[a]*FIT_MULT[e.grade]*condFactor(e.p.cond)*(m.sides[e.side].home?1.03:1)}
function buildSide(T,side){const slots=FORMATIONS[T.tactics.formation];const ents=[];
  slots.forEach((s,i)=>{const p=T.squad.find(x=>x.id===T.tactics.lineup[i]);if(!p)return;
    ents.push({p,slot:s,i,instr:T.tactics.instr[i]??2,grade:fitGrade(p,s.pos),x:PW/2,y:PL/2,side,mins:0,dec:1})});return ents}
function createMatch(A,B,seed){
  const m={rng:mulberry32(seed||1),t:0,half:1,done:false,ht:false,score:[0,0],stats:{shots:[0,0],on:[0,0],poss:[0,0]},events:[],pause:0,kickTo:null,
    sides:[{club:A.club,mentality:A.tactics.mentality,home:!!A.home},{club:B.club,mentality:B.tactics.mentality,home:!!B.home}],
    ball:{x:PW/2,y:PL/2,owner:null,fl:null},possSide:0,lastGoal:0};
  m.ents=[...buildSide(A,0),...buildSide(B,1)];kickoff(m,0);return m;}
function setSide(m,side,T){const old=m.ents.filter(e=>e.side===side);m.ents=m.ents.filter(e=>e.side!==side);const nw=buildSide(T,side);
  for(const e of nw){const o=old.find(x=>x.p.id===e.p.id);if(o){e.x=o.x;e.y=o.y;e.mins=o.mins}else{const h=homePos(m,e);e.x=h[0];e.y=h[1]}}
  m.ents.push(...nw);m.sides[side].mentality=T.tactics.mentality;if(m.ball.owner&&!m.ents.includes(m.ball.owner))kickoff(m,side);}
const minute=m=>Math.min(90,Math.floor(m.t/HALF*45)+1);
function ev(m,side,type,text){m.events.push({min:minute(m),side,type,text})}
function gkOf(m,side){return m.ents.find(e=>e.side===side&&e.slot.pos==='GK')||m.ents.find(e=>e.side===side)}
function homePos(m,e){
  const side=m.sides[e.side];const prog=e.side===0?m.ball.y/PL:1-m.ball.y/PL;let depth;
  if(e.slot.pos==='GK')depth=.025+(prog>.5?.05:0);
  else{depth=.05+e.slot.y*.6+(prog-.5)*.42+(side.mentality-2)*.035*(1-e.slot.y*.6)+(e.instr-2)*.045+(m.possSide===e.side?.06+e.slot.y*.08:-.03);depth=clamp(depth,.06,.94)}
  const bx=e.side===0?m.ball.x/PW:1-m.ball.x/PW;let fx=e.slot.x+(bx-.5)*.25;
  const wob=e.slot.pos==='GK'?0:Math.sin(m.t*.6+e.i*1.7)*1.1;
  return [e.side===0?fx*PW+wob:(1-fx)*PW-wob,e.side===0?depth*PL:(1-depth)*PL];
}
function kickoff(m,side){m.ball.fl=null;m.ball.x=PW/2;m.ball.y=PL/2;m.possSide=side;
  for(const e of m.ents){const h=homePos(m,e);e.x=h[0];e.y=e.side===0?Math.min(h[1],PL/2-1.5):Math.max(h[1],PL/2+1.5)}
  const own=m.ents.filter(e=>e.side===side&&e.slot.pos!=='GK');if(!own.length){m.ball.owner=null;return}
  const k=own.reduce((a,b)=>(b.slot.y-Math.abs(b.slot.x-.5)*.3)>(a.slot.y-Math.abs(a.slot.x-.5)*.3)?b:a);
  k.x=PW/2;k.y=PL/2+(side===0?-.8:.8);setOwner(m,k);k.dec=.8;}
function setOwner(m,e){m.ball.owner=e;m.possSide=e.side}
function nearestOpp(m,side,x,y){let best=null,bd=1e9;for(const o of m.ents){if(o.side===side)continue;const d=Math.hypot(o.x-x,o.y-y);if(d<bd){bd=d;best=o}}return [best,bd]}
function choosePass(m,e){const dir=e.side===0?1:-1,ment=m.sides[e.side].mentality;let best=null,bs=-1e9;
  for(const t of m.ents){if(t.side!==e.side||t===e)continue;const dx=t.x-e.x,dy=t.y-e.y,dist=Math.hypot(dx,dy);if(dist<4||dist>42)continue;
    const open=nearestOpp(m,e.side,t.x,t.y)[1];let sc=dy*dir*(.13+.03*ment)+Math.min(open,8)*.18-dist*.03+m.rng()*1.5;if(t.slot.pos==='GK')sc-=4;
    if(sc>bs){bs=sc;best={t,dist,open}}}return best}
function doPass(m,e,c){const ok=clamp(.78+(eff(m,e,'pas')-40)/160-c.dist/150+(Math.min(c.open,10)-5)*.015-(m.sides[e.side].mentality-2)*.025,.35,.96);let tgt=c.t;
  if(m.rng()>ok){tgt=nearestOpp(m,e.side,e.x+(c.t.x-e.x)*.7,e.y+(c.t.y-e.y)*.7)[0]||c.t}
  m.ball.owner=null;m.ball.fl={type:'pass',fx:m.ball.x,fy:m.ball.y,tgt,t:0,dur:.2+c.dist/22}}
function doShot(m,e,d){const side=e.side,gk=gkOf(m,1-side),s=eff(m,e,'sho'),g=gk?eff(m,gk,'gk'):15;
  const dm=1-(2-m.sides[1-side].mentality)*.15;const onP=clamp((.42+s/220-d/95)*dm,.12,.85),goalP=clamp((.78*s/(s+g)-d/160+.08)*dm,.06,.65);m.stats.shots[side]++;
  let res='miss';if(m.rng()<onP){m.stats.on[side]++;res=m.rng()<goalP?'goal':'save'}
  const gy=side===0?PL:0,dir=side===0?1:-1;let tx=PW/2+(m.rng()*2-1)*3.2;if(res==='miss')tx=PW/2+(m.rng()<.5?-1:1)*(4.5+m.rng()*5);
  const ty=res==='save'?gy-dir*1.2:gy+dir*(res==='goal'?1.2:2.5);
  m.ball.owner=null;m.ball.fl={type:'shot',fx:m.ball.x,fy:m.ball.y,tx,ty,t:0,dur:Math.max(.25,d/30),res,side,shooter:e,gk};}
function resolveFlight(m){const f=m.ball.fl;m.ball.fl=null;const nm=e=>e.p.ln;
  if(f.type==='pass'){if(!m.ents.includes(f.tgt)){kickoff(m,1-m.possSide);return}setOwner(m,f.tgt);f.tgt.dec=.45+m.rng()*.7;return}
  const club=m.sides[f.side].club.short;
  if(f.res==='goal'){m.score[f.side]++;f.shooter.p.st.goals++;ev(m,f.side,'goal',`GOAL! ${nm(f.shooter)} (${club}) ${m.score[0]}-${m.score[1]}`);m.lastGoal=m.t;m.pause=3;m.kickTo=1-f.side;m.ball.owner=null;return}
  const gk=gkOf(m,1-f.side);
  if(f.res==='save'){if(m.rng()<.35)ev(m,f.side,'chance',`Big save from ${gk?nm(gk):'the keeper'} to deny ${nm(f.shooter)}`)}
  else if(m.rng()<.25)ev(m,f.side,'chance',`${nm(f.shooter)} drags it wide`);
  if(gk){gk.x=PW/2;gk.y=f.side===0?PL-2:2;setOwner(m,gk);gk.dec=f.res==='save'?1.1:1.6;m.ball.x=gk.x;m.ball.y=gk.y}else kickoff(m,1-f.side);}
function decide(m,e){const side=e.side,goalY=side===0?PL:0,d=Math.hypot(e.x-PW/2,goalY-e.y),ment=m.sides[side].mentality;
  let shootP=e.slot.pos==='GK'||d>32?0:Math.pow((32-d)/32,1.6)*.85*(.88+.06*ment+.04*(e.instr-2));
  if(m.rng()<shootP)return doShot(m,e,d);
  const press=nearestOpp(m,side,e.x,e.y)[1]<4;
  const passP=e.slot.pos==='GK'?1:.45+(2-ment)*.04+(press?.3:-.1);
  if(m.rng()<passP){const c=choosePass(m,e);if(c)return doPass(m,e,c)}
  e.dec=.5+m.rng()*.8;}
function moveTo(e,tx,ty,sp,dt){const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);if(d<.05)return;const s=Math.min(d,sp*dt);e.x+=dx/d*s;e.y+=dy/d*s}
function step(m,dt){
  if(m.done||m.ht)return;
  m.t+=dt;m.stats.poss[m.possSide]+=dt;
  for(const e of m.ents){e.mins+=dt;const p=e.p;
    p.cond=Math.max(0,p.cond-18/(2*HALF)*FIT_DRAIN[e.grade]*INSTR_DRAIN[e.instr]*(1.3-p.sta/200)*(1+(100-p.cond)/100)*dt)}
  const b=m.ball;
  if(m.pause>0){m.pause-=dt;for(const e of m.ents){const h=homePos(m,e);moveTo(e,h[0],h[1],4,dt)}if(m.pause<=0&&m.kickTo!=null){kickoff(m,m.kickTo);m.kickTo=null}}
  else{
    if(b.fl){const f=b.fl;f.t+=dt;const tx=f.tgt?f.tgt.x:f.tx,ty=f.tgt?f.tgt.y:f.ty,k=Math.min(1,f.t/f.dur);b.x=f.fx+(tx-f.fx)*k;b.y=f.fy+(ty-f.fy)*k;if(k>=1)resolveFlight(m)}
    else if(b.owner){const e=b.owner;
      if(e.slot.pos!=='GK'){const gy=e.side===0?PL:0,tx=PW/2+(e.x-PW/2)*.7,dx=tx-e.x,dy=gy-e.y,dd=Math.hypot(dx,dy)||1;
        const sp=4.2*(.75+eff(m,e,'pac')/200);e.x=clamp(e.x+dx/dd*sp*dt,1,PW-1);e.y=clamp(e.y+dy/dd*sp*dt,1,PL-1)}
      b.x=e.x;b.y=e.y+(e.side===0?.8:-.8);
      const [o,od]=nearestOpp(m,e.side,e.x,e.y);
      if(o&&od<1.8){const de=eff(m,o,'def'),dr=eff(m,e,e.slot.pos==='GK'?'pas':'dri');if(m.rng()<dt*.45*de/(de+dr)*(1+(2-m.sides[o.side].mentality)*.18)){setOwner(m,o);o.dec=.4+m.rng()*.5}}
      if(od<4)e.dec-=dt;e.dec-=dt;if(e.dec<=0&&b.owner===e)decide(m,e);
    }
    // off-ball
    const def=1-m.possSide;let p1=null,p2=null,d1=1e9,d2=1e9;
    for(const e of m.ents){if(e.side!==def||e.slot.pos==='GK')continue;const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<d1){p2=p1;d2=d1;p1=e;d1=d}else if(d<d2){p2=e;d2=d}}
    for(const e of m.ents){if(e===b.owner)continue;if(b.fl&&b.fl.tgt===e)continue;const sp=5*(.8+e.p.attrs.pac/250)*condFactor(e.p.cond);
      if(e===p1)moveTo(e,b.x,b.y,sp*1.1,dt);
      else if(e===p2){const gy=def===0?0:PL;moveTo(e,(b.x+PW/2)/2,b.y+(gy-b.y)*.25,sp,dt)}
      else{const h=homePos(m,e);moveTo(e,h[0],h[1],sp,dt)}}
  }
  if(m.half===1&&m.t>=HALF){m.half=2;m.ht=true;ev(m,-1,'ht',`Half-time: ${m.score[0]}-${m.score[1]}`);kickoff(m,1)}
  else if(m.t>=2*HALF){m.done=true;ev(m,-1,'ft',`Full-time: ${m.score[0]}-${m.score[1]}`)}
}
function simulate(m){while(!m.done){step(m,.1);if(m.ht)m.ht=false}return m}

// =================== SCHOLARSHIPS ===================
// A scholarship is a yearly amount off a player's cost of attendance (tuition + housing + food + books).
// Each program has a yearly athletic-scholarship pool; walk-ons get no athletic aid.
const TIER_COA=[[24000,32000,4,6],[30000,40000,7,9],[35000,55000,10,12],[45000,80000,28,28]]; // COA range, pool in full-scholarship equivalents
const ASK=[[0,.2],[.15,.4],[.35,.65],[.6,.9],[.85,1]];
const schCommitted=()=>sq().reduce((s,p)=>s+(p.schol||0),0);
const schAvail=()=>Math.max(0,st.pool-schCommitted());
const kfmt=n=>n>=10000?'$'+Math.round(n/1000)+'k':n>=1000?'$'+(n/1000).toFixed(1)+'k':'$'+Math.round(n);
const pct=n=>Math.round(n/st.coa*100)+'%';
const schAmt=f=>Math.round(f*st.coa/500)*500;
function schLabel(p){return p.acad?'Academic scholarship (does not use your pool)':p.schol?`${money(p.schol)}/yr · ${pct(p.schol)} of costs`:'Walk-on: no athletic scholarship'}
function askFor(rar){const r=ASK[rar];return Math.round((r[0]+R()*(r[1]-r[0]))*20)/20}
function assignSchol(sqd,coa,cap){for(const p of sqd){const f=p.rar===0?(R()<.6?0:ri(1,5)*.05):p.rar===1?ri(5,10)*.05:p.rar===2?ri(11,16)*.05:p.rar===3?ri(15,20)*.05:1;p.schol=Math.round(f*coa/500)*500}
  const tot=sqd.reduce((s,p)=>s+p.schol,0);if(tot>cap){const k=cap/tot;sqd.forEach(p=>p.schol=Math.round(p.schol*k/500)*500)}}
function offerChance(a,f){let c;if(a.ask<=0)c=f>0?.97:.8;else{const r=f/a.ask;c=r>=1?.92:f===0?(a.walkon?.55:.06):.1+.75*r}
  return clamp(c+Math.min(.1,st.rep/2000)+(!a.tag||a.tag==='Camp'?.04:0),.03,.97)}
function showOffer(i){const a=st.apps[i],p=a.p,av=schAvail();const opts=[0,.25,.5,.75,1];if(a.ask&&!opts.includes(a.ask))opts.push(a.ask);opts.sort((x,y)=>x-y);
  sheet(`<h2>Offer ${esc(p.fn)} ${esc(p.ln)} ${helpBtn('schol')}</h2>
   <div class="card" style="font-size:13px;background:var(--panel2)">Cost of attendance at ${esc(me().name)}: <b>${money(st.coa)}/yr</b><br><span class="mute">Tuition, housing, food and books.</span><br><br>
    ${p.fn}'s family hopes for: <b>${a.ask?`about ${Math.round(a.ask*100)}% (${money(schAmt(a.ask))}/yr)`:'a walk-on spot is fine'}</b><br>Your scholarship pool: <b>${money(av)}</b> available of ${money(st.pool)}/yr</div>
   ${opts.map(f=>{const amt=schAmt(f),ch=offerChance(a,f),ok=amt<=av;return `<div class="row" style="padding:9px 0;border-top:1px solid var(--line)"><div class="sp"><b>${f===0?'Walk-on spot':f===1?'Full scholarship':Math.round(f*100)+'% scholarship'}</b>${f===a.ask&&f?' <span class="tag r1">Their ask</span>':''}<br><small class="mute">${f===0?'No athletic aid: they pay their own way':money(amt)+' per year, every year they stay'}</small></div>
     <small style="width:54px;text-align:right;color:${ch>=.7?'var(--green)':ch>=.4?'var(--yellow)':'var(--orange)'}"><b>${Math.round(ch*100)}%</b><br>chance</small><button class="btn sm" data-act="makeoffer" data-i="${i}" data-v="${f}" ${ok?'':'disabled'}>Offer</button></div>`}).join('')}
   <p class="mute" style="font-size:11px">A scholarship is renewed each year, so it uses that much of your pool for every season the player stays. Money frees up when they graduate or leave.</p>`)}

 ['The pitch floods when it rains','Drainage is "on the list". The last coach left mid-season for a high-school job. Scholarship money is tight, but the squad is average and the expectations are low.',{shift:-1,budget:4000,eq:5}],
 ['Talented squad, crumbling facilities','The locker room is a portable cabin and one floodlight works. But this roster has some real players, and the athletic director expects results.',{shift:3,budget:2500,eq:4}],
 ['Keen boosters, empty trophy cabinet','Local businesses love the team and donate generously. The squad, honestly, does not win much. Money to spend, players to find.',{shift:-3,budget:9000,eq:5}],
 ['A blank slate','Mostly young players, a modest budget and an athletic director who just wants the program "to be respectable". The biggest scholarship pool of the four.',{shift:0,budget:5000,eq:6}]];

    expect:s.shift>=2?'Finish in the top 4':s.shift>=0?'Finish in the top half':'Stay out of the bottom 2'}})}

function newGame(coach,j){
  const g=j.gender,c=j.school,k=KITS[c[3]];
  const user={id:'U',name:c[0],nick:c[1],short:c[2],kit:[k[1],k[2]],user:true};
  const rars=SQUAD_POS.map(()=>0);[1,4,9,15].forEach(i=>rars[i]=1);if(j.shift>=0)rars[ri(8,17)]=2;
  user.squad=genSquad(g,j.shift,rars);
  const teams=[user];
  BOT_CLUBS.filter(b=>b[0]!==c[0]).slice(0,9).forEach((b,i)=>{const sty=BOT_STYLE[i%BOT_STYLE.length];const kk=KITS[b[3]];
    const t={id:'B'+i,name:b[0],nick:b[1],short:b[2],kit:[kk[1],kk[2]],style:sty[0],strength:ri(-4,4)};

const HANDBOOK=[
 ['basics','🏫','College soccer in 2 minutes',`<p>In the US, most talented young players don't join a pro academy. They play for their <b>high school</b> and a <b>youth club</b>, then go to <b>college</b> on a full or (more often) partial scholarship while they study for a degree.</p>

 ['levels','🪜','The levels of college soccer',`<p>Real colleges compete in several associations:</p><ul><li><b>NCAA Division I</b>: the biggest universities, about 215 men's and 340 women's programs.</li><li><b>NCAA Division II</b>: smaller schools, partial scholarships.</li><li><b>NCAA Division III</b>: no athletic scholarships at all.</li><li><b>NAIA</b>: small colleges, scholarships allowed.</li><li><b>NJCAA (junior colleges, "JUCO")</b>: two-year colleges; players then transfer to four-year schools.</li></ul>

  <p>An <b>athletic scholarship</b> pays part of that cost, <b>every year</b> the player stays (it's reviewed annually). Soccer scholarships are usually <b>partial</b>: a coach splits a limited budget across the squad. For example, $15,000 of a $28,000 cost (54%), with the family paying the rest. Full scholarships ("full rides") mostly go to stars.</p>
  <p>Since 2025, NCAA Division I has roster limits (28 for soccer) and schools may fund scholarships up to the whole roster. Smaller divisions still cap scholarship money.</p>
  <p><b>In Club FC:</b> your program has a yearly <b>scholarship pool</b> (🎓 in the header shows what's left). Every offer uses part of it for each year the player stays. When players graduate or leave, their money comes back. Recruits tell you roughly what they hope for; offering less lowers the chance they'll say yes.</p>`],
 ['walkon','🚶','Walk-ons',`<p>A <b>walk-on</b> is a player on the team with <b>no athletic scholarship</b>. They pay their own way, or have academic or need-based aid from the college instead.</p>

 ['elig','📅','Eligibility & class years',`<p>Each player has <b>four seasons</b> to compete: Freshman (FR), Sophomore (SO), Junior (JR) and Senior (SR). A player who sits out a year without using eligibility is a "redshirt".</p>

 ['season','🗓','The season & tournaments',`<p>Real season: preseason in August, about 18 regular-season games through October, then your <b>conference tournament</b>. Winning it earns an automatic bid to the <b>NCAA tournament</b> (48 men's teams, 64 women's), which ends with the College Cup final four in December.</p>
  <p><b>In Club FC:</b> 18 matchdays (one per day), then the top 4 play a conference tournament. The champion gets an automatic bid to a 16-team national tournament; the league winner gets an "at-large" bid if they didn't win the conference final. Knockout draws go to penalties.</p>`],
 ['recruit','🔎','Recruiting',`<p>Real recruits reach coaches in many ways: emailing highlight videos, attending college <b>ID camps</b>, playing at <b>showcase tournaments</b>, being spotted in elite youth leagues (ECNL, MLS NEXT, Girls Academy), or through <b>international agencies</b> that run trials abroad. NCAA rules limit when coaches can contact recruits (Division I: from June 15 after a player's sophomore year of high school).</p>

 ['portal','🚪','Transfer Portal & JUCO',`<p>The <b>Transfer Portal</b> is how college players move to another school: they enter the portal and other coaches can contact them. Players use it for more playing time, to follow a coach, or to move closer to home.</p>

 ['game','🎮','How to play: the daily loop',`<p>Each day is one matchday:</p><ol><li><b>Train</b> a few players (Train tab). It costs condition, adds rating.</li><li><b>Recruit</b>: check the Inbox and make offers.</li><li><b>Set your lineup</b> (Tactics): formation, mentality, who plays where.</li><li><b>Play</b> the match, watching live or by quick sim.</li></ol>

let MX=null; // live match controller
function opponentTeam(f){return team(f.h==='U'?f.a:f.h)}
function prepBot(t){t.tactics.lineup=autopick(t.squad,t.tactics.formation)}
function kitsFor(home,away){const dist=(a,b)=>{const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const p=h(a),q=h(b);return Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2])};
  let ak=away.slice();if(dist(home[0],ak[0])<110){ak=[away[1],away[0]];if(dist(home[0],ak[0])<110)ak=dist(home[0],'#f5f5f5')>200?['#f5f5f5','#222222']:['#222222','#f5f5f5']}return ak}
function startMatch(mode){
  const f=curFixture();if(!f)return;const T=me().tactics;
  if(T.lineup.filter(Boolean).length<11){T.lineup=autopick(sq(),T.formation);toast('Lineup auto-filled')}
  const opp=opponentTeam(f);prepBot(opp);
  const A={club:me(),squad:sq(),tactics:T,home:f.h==='U'},B={club:opp,squad:opp.squad,tactics:opp.tactics,home:f.h!=='U'};
  const m=createMatch(A,B,Math.floor(R()*1e9));m.kits=[me().kit,kitsFor(me().kit,opp.kit)];
  if(mode==='quick'){simulate(m);finishMatch(m)}else liveMatch(m);
}

   <div id="pitchWrap"><canvas id="pitch"></canvas><div id="mOver"></div></div>
   <div class="mctl"><div class="ticker" id="mTick"></div><div class="mstats" id="mStats"></div>
    <div class="seg" style="margin-bottom:6px" id="mMent">${INSTR.map((n,i)=>`<button data-act="mment" data-v="${i}" class="${m.sides[0].mentality===i?'on':''}">${n}</button>`).join('')}</div>
    <div class="row" style="gap:6px"><div class="seg" style="flex:1" id="mSpeed">${[1,4,16].map(s=>`<button data-act="mspeed" data-v="${s}" class="${s===1?'on':''}">${s}×</button>`).join('')}</div>

function drawMatch(cv,m,cam){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height,ppm=W/(PW+8),visL=H/ppm;
  const ty=visL>=PL+8?PL/2:clamp(m.ball.y,visL/2-4,PL-visL/2+4);cam.y+=(ty-cam.y)*.08;
  const X=x=>(x+4)*ppm,Y=y=>H/2-(y-cam.y)*ppm;
  c.fillStyle='#2b8a3a';c.fillRect(0,0,W,H);
  for(let s=-10;s<PL+10;s+=7){if(Math.floor(s/7)%2){c.fillStyle='rgba(255,255,255,.045)';c.fillRect(0,Y(s+7),W,7*ppm)}}
  c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=Math.max(1.5,ppm*.18);
  c.strokeRect(X(0),Y(PL),PW*ppm,PL*ppm);
  c.beginPath();c.moveTo(X(0),Y(PL/2));c.lineTo(X(PW),Y(PL/2));c.stroke();
  c.beginPath();c.arc(X(PW/2),Y(PL/2),9.15*ppm,0,7);c.stroke();
  for(const end of [0,PL]){const d=end?-1:1;
    c.strokeRect(X(PW/2-20.15),Y(end+(d>0?16.5:0)),40.3*ppm,16.5*ppm);
    c.strokeRect(X(PW/2-9.16),Y(end+(d>0?5.5:0)),18.32*ppm,5.5*ppm);
    c.beginPath();c.arc(X(PW/2),Y(end+d*11),ppm*.35,0,7);c.fillStyle='#fff';c.fill();
    c.beginPath();c.arc(X(PW/2),Y(end+d*11),9.15*ppm,d>0?Math.PI*1.2:Math.PI*.2,d>0?Math.PI*1.8:Math.PI*.8);c.stroke();
    c.fillStyle='rgba(255,255,255,.25)';c.fillRect(X(PW/2-3.66),Y(end+(d>0?0:2))-(d>0?0:0),7.32*ppm,2*ppm);
    c.strokeRect(X(PW/2-3.66),d>0?Y(end):Y(end+2),7.32*ppm,2*ppm)}
  const r=Math.max(9,1.7*ppm);c.textAlign='center';c.textBaseline='middle';c.font=`800 ${Math.round(r*1.05)}px -apple-system,Segoe UI,sans-serif`;
  for(const e of m.ents){const k=m.kits[e.side],x=X(e.x),y=Y(e.y);
    c.beginPath();c.arc(x+1.5,y+2.5,r,0,7);c.fillStyle='rgba(0,0,0,.28)';c.fill();
    c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=k[0];c.fill();
    if(k[2]&&k[2]!=='plain'){c.save();c.beginPath();c.arc(x,y,r,0,7);c.clip();c.fillStyle=k[1];const w=r*.32;
      if(k[2]==='stripes')for(let s=-r+w*.5;s<r;s+=w*2.4)c.fillRect(x+s,y-r,w,r*2);else if(k[2]==='hoops')for(let s=-r+w*.5;s<r;s+=w*2.4)c.fillRect(x-r,y+s,r*2,w);
      else if(k[2]==='halves')c.fillRect(x,y-r,r,r*2);else if(k[2]==='sash'){c.translate(x,y);c.rotate(Math.PI/4);c.fillRect(-r,-w*.8,r*2,w*1.6)}c.restore()}
    c.lineWidth=Math.max(2.5,r*.22);c.strokeStyle=k[1];c.stroke();
    if(m.ball.owner===e){c.beginPath();c.arc(x,y,r+4,0,7);c.lineWidth=2;c.strokeStyle='rgba(255,255,255,.8)';c.stroke()}
    if(k[2]&&k[2]!=='plain'){c.lineWidth=3;c.strokeStyle=k[0];c.strokeText(e.p.num,x,y+1)}c.fillStyle=k[1];c.fillText(e.p.num,x,y+1)}
  const b=m.ball,bx=X(b.x),by=Y(b.y),br=Math.max(4.5,.65*ppm);let lift=0;
  if(b.fl){const k=Math.min(1,b.fl.t/b.fl.dur);lift=Math.sin(k*Math.PI)*(b.fl.type==='shot'?.6:Math.min(1,b.fl.dur))*ppm*1.2}
  c.beginPath();c.arc(bx+2,by+3,br,0,7);c.fillStyle='rgba(0,0,0,.35)';c.fill();
  c.beginPath();c.arc(bx,by-lift,br,0,7);c.fillStyle='#fff';c.fill();c.lineWidth=1.5;c.strokeStyle='#111';c.stroke();
}

function curFixture(){
  if(st.phase==='regular'){const f=myFixture();return f?{h:f.h,a:f.a,ref:f,label:`Matchday ${st.round+1}`}:null}
  const ko=st.ko;if(!ko||st.phase==='done')return null;const rd=ko.rounds[ko.rounds.length-1];const t=rd.ties.find(x=>(x.h==='U'||x.a==='U')&&x.w==null);
  return t?{h:t.h,a:t.a,ref:t,ko:true,label:`${ko.name} · ${rd.name}`}:null}
function phaseLabel(){return st.phase==='regular'?`Day ${Math.min(st.round+1,st.fixtures.length)}/${st.fixtures.length}`:st.phase==='done'?'Season over':st.ko.name}
function shootout(A,B){const kick=(S,G)=>{const sh=S.filter(e=>e.slot.pos!=='GK').sort((a,b)=>b.p.attrs.sho-a.p.attrs.sho);const gk=G.find(e=>e.slot.pos==='GK');
    return i=>{const s=sh[i%sh.length];return !s||R()<clamp(.74+(s.p.attrs.sho-(gk?gk.p.attrs.gk:20))/220,.55,.9)}};
  const ka=kick(A,B),kb=kick(B,A);let a=0,b=0,i=0;for(;i<5;i++){if(ka(i))a++;if(kb(i))b++}while(a===b&&i<40){if(ka(i))a++;if(kb(i))b++;i++}if(a===b)a++;return [a,b]}
function decideTie(t,m){if(t.hs===t.as){t.pens=shootout(m.ents.filter(e=>e.side===0),m.ents.filter(e=>e.side===1))}t.w=(t.hs>t.as||(t.pens&&t.pens[0]>t.pens[1]))?t.h:t.a}
function simTies(ties){for(const t of ties){if(t.w!=null)continue;const h=team(t.h),a=team(t.a);prepBot(h);prepBot(a);
  const m=simulate(createMatch({club:h,squad:h.squad,tactics:h.tactics,home:true},{club:a,squad:a.squad,tactics:a.tactics},Math.floor(R()*1e9)));t.hs=m.score[0];t.as=m.score[1];decideTie(t,m)}}
const RNAME={8:'Round of 16',4:'Quarter-finals',2:'Semi-finals',1:'Final'};
const tieStr=t=>`${team(t.h).nick} ${t.hs}-${t.as} ${team(t.a).nick}${t.pens?` (${t.pens[0]}-${t.pens[1]} pens)`:''}`;
function startConf(out){const tb=table(st);st.leagueChamp=tb[0].id;const ids=tb.slice(0,4).map(r=>r.id);const seed=ids.indexOf('U')+1;
  if(tb[0].id==='U'){st.rep+=25;st.cash+=2000;out.push('🏆 Regular-season champions! +25 rep, +$2,000')}
  st.ko={type:'conf',name:'Conference Tournament',rounds:[{name:'Semi-finals',ties:[{h:ids[0],a:ids[3]},{h:ids[1],a:ids[2]}]}]};st.phase='conf';
  out.push(`Regular season over: ${team(tb[0].id).nick} top the table. ${seed?`You enter the Conference Tournament as the #${seed} seed.`:`You finished outside the top 4 and miss the Conference Tournament.`}`)}
function teamPower(t){const s=[...t.squad].sort((a,b)=>b.rating-a.rating).slice(0,11);return s.reduce((x,p)=>x+p.rating,0)/s.length}
function startNat(out){const q=[st.confChamp];if(st.leagueChamp!==st.confChamp)q.push(st.leagueChamp);
  st.natTeams=[];for(let i=0;st.natTeams.length<16-q.length;i++)st.natTeams.push(genOtherTeam(i,tierOf().shift+ri(-1,7)));
  const all=[...q.map(team),...st.natTeams].sort((a,b)=>teamPower(b)-teamPower(a));const ord=[0,15,7,8,3,12,4,11,1,14,6,9,2,13,5,10];

  const seed=all.findIndex(t=>t.id==='U')+1;

function finishTournament(out){const ko=st.ko,fin=ko.rounds[ko.rounds.length-1].ties[0],w=team(fin.w);
  if(ko.type==='conf'){st.confChamp=fin.w;st.confChampName=`${w.name} ${w.nick}`;out.push(`Conference Tournament final: ${tieStr(fin)}.`);
    if(fin.w==='U'){st.rep+=40;st.cash+=3000;st.userKO.push('Conference Tournament champions');out.push('🏆 CONFERENCE CHAMPIONS! +40 rep, +$3,000')}

function advancePhase(){const out=[];
  for(let g=0;g<12;g++){
    if(st.phase==='done')break;
    if(st.phase==='regular'){if(st.round<st.fixtures.length)break;startConf(out);continue}
    const ko=st.ko,rd=ko.rounds[ko.rounds.length-1];
    if(rd.ties.some(t=>t.w==null)){if(rd.ties.some(t=>t.w==null&&(t.h==='U'||t.a==='U')))break;simTies(rd.ties)}
    const win=rd.ties.map(t=>t.w);
    if(win.length===1){finishTournament(out);continue}
    const ties=[];for(let i=0;i<win.length;i+=2)ties.push({h:win[i],a:win[i+1]});
    const n=ties.length;ko.rounds.push({name:ko.type==='nat'&&n===1?'The Final Whistle':RNAME[n],ties});
    if(win.includes('U'))out.push(`You're through to the ${ko.name} ${ko.rounds[ko.rounds.length-1].name}!`);
  }
  return out}

function finishMatch(m){
  const f=curFixture();const home=f.h==='U';const us=m.score[0],them=m.score[1];const t=f.ref;

    if(us===them){const p=shootout(ours,theirs);t.pens=home?p:[p[1],p[0]];penTxt=` · ${p[0]}-${p[1]} on penalties`}
    t.w=(t.hs>t.as||(t.pens&&t.pens[0]>t.pens[1]))?t.h:t.a;

  for(const e of m.ents){e.p.st.mins+=Math.round(e.mins/HALF*45);e.p.sMins=(e.p.sMins||0)+Math.round(e.mins/HALF*45);if(e.mins>0)e.p.st.apps++}
  for(const e of m.ents.filter(x=>x.side===0)){const p=e.p;if(p.rating<p.pot&&R()<(p.year===1?.22:.12))p.rating++}
  if(st.phase==='regular'){for(const fx of st.fixtures[st.round]){if(fx===t)continue;const h=team(fx.h),a=team(fx.a);prepBot(h);prepBot(a);
    const mm=simulate(createMatch({club:h,squad:h.squad,tactics:h.tactics,home:true},{club:a,squad:a.squad,tactics:a.tactics},Math.floor(R()*1e9)));fx.hs=mm.score[0];fx.as=mm.score[1]}}
  else simTies(st.ko.rounds[st.ko.rounds.length-1].ties);
  const res=f.ko?(t.w==='U'?'W':'L'):us>them?'W':us===them?'D':'L';
  const inc={result:{W:600,D:300,L:150}[res]*(f.ko?2:1),gate:home?[0,500,1200,2500,5000,9000][st.fac.stadium]*(f.ko?1.5:1):0,sponsor:st.fac.media*150};
  const tot=inc.result+inc.gate+inc.sponsor;st.cash+=tot;if(res==='W')st.gold+=5;if(!f.ko)st.rep+={W:3,D:1,L:0}[res];migrate();st.pass.xp+={W:30,D:20,L:10}[res];
  const opp=m.sides[1].club;
  const scorers=m.events.filter(e=>e.type==='goal'&&e.side===0).map(e=>e.text.split(' ')[1]).join(', ');
  st.last=`${me().short} ${us}-${them} ${opp.short}${penTxt} (${res})`;
  news(`${f.ko?f.label+': ':''}${res==='W'?'Win':res==='D'?'Draw':'Defeat'}: ${me().nick} ${us}-${them} ${opp.nick}${penTxt}${scorers?'. Scorers: '+scorers:''}`);
  const tr=[];const gain=.70+st.fac.training*.06;
  for(const x of st.training){const p=P(x.id);if(!p)continue;p.cond=Math.max(0,p.cond-25);
    if(x.focus){if(R()<.5){p.fitB[x.focus]=(p.fitB[x.focus]||0)+1;tr.push(`${p.ln} learned ${x.focus}`)}else tr.push(`${p.ln}: no progress at ${x.focus}`)}
    else if(p.rating<p.pot&&R()<gain){p.rating++;for(const a of KEY_ATTR[p.pos])p.attrs[a]++;if(R()<.5){const a=pick(['pac','sho','pas','dri','def','phy']);p.attrs[a]++}tr.push(`${p.ln} +1 → ${p.rating}`)}
    else tr.push(`${p.ln}: no gain`)}

  if(st.phase==='regular')st.round++;
  st.day=(st.day||0)+1;newApps(1+(R()<.25+st.fac.recruiting*.1?1:0)+(st.rep>=60?1:0));st.apps=st.apps.filter(a=>a.exp>st.day);
  const head=[...dailyTicks(),...advancePhase()];st.tut.play=1;save();
  setTimeout(()=>tip('ft','Check <b>condition</b> after every match. Starters lose about 18% a match and recover about 14% a day, so by mid-season you\'ll need to rotate. Tired players play worse and get injured more.','game'),400);
  const evs=m.events.filter(e=>e.type==='goal');

   <div class="row" style="justify-content:center;gap:16px;margin:10px 0"><b>${me().short}</b><span style="font-size:38px;font-weight:900">${us} - ${them}</span><b>${opp.short}</b></div>
   ${penTxt?`<div style="font-weight:800;color:${res==='W'?'var(--lime)':'var(--red)'}">${res==='W'?'Won':'Lost'}${penTxt}</div>`:''}
   <div style="font-size:12px" class="mute">${evs.map(e=>`${e.min}' ${e.text.replace(/^GOAL! /,'').replace(/ \d+-\d+$/,'')}`).join('<br>')||'No goals'}</div></div>
   ${head.length?`<div class="card" style="margin-top:12px;border-color:var(--accent)">${head.map(h=>`<div style="padding:3px 0">${esc(h)}</div>`).join('')}</div>`:''}
   <div class="statgrid" style="margin-top:12px"><div class="stat"><small>Shots</small><b>${m.stats.shots[0]}–${m.stats.shots[1]}</b></div><div class="stat"><small>On target</small><b>${m.stats.on[0]}–${m.stats.on[1]}</b></div><div class="stat"><small>Possession</small><b>${Math.round(m.stats.poss[0]/(m.stats.poss[0]+m.stats.poss[1])*100)}%</b></div></div>
   <h3>Income</h3><div style="font-size:13px">Result ${money(inc.result)} · Gate ${money(inc.gate)} · Sponsors ${money(inc.sponsor)} = <b>${money(tot)}</b>${res==='W'?' · +5 ◆':''}</div>
   ${tr.length?`<h3>Training results</h3><div style="font-size:13px">${tr.map(esc).join('<br>')}</div>`:''}
   <h3>Condition after recovery</h3><div style="font-size:12px" class="mute">${m.ents.filter(e=>e.side===0).map(e=>`${esc(e.p.ln)} <b style="color:${condCol(e.p.cond)}">${Math.round(e.p.cond)}%</b>`).join(' · ')}</div>
   <button class="btn sec full" style="margin-top:14px" data-act="addouble" data-v="${tot}">▶ Watch ad: double income (+${money(tot)})</button><button class="btn full" style="margin-top:8px" data-act="dayend">${st.phase==='done'?'Season review':'Continue'}</button>`,()=>{if(st.phase==='done')seasonEnd()});
  render();
}

function seasonEnd(){
  closeSheet();const tb=table(st);const pos=tb.findIndex(r=>r.id==='U')+1;const champ=team(tb[0].id);
  const repGain=Math.max(0,[0,60,40,30,20,15,10,6,3,1,0][pos]||0);st.rep+=repGain;
  const grads=[],pros=[];
  for(const p of sq().filter(p=>p.year>=4)){const pro=p.rating>=48+tierOf().shift*.5?pick(st.gender==='w'?PRO_W:PRO_M):null;
    st.hof.push({name:p.fn+' '+p.ln,flag:p.flag,pos:p.pos,rating:p.rating,season:st.season,pro});if(pro){pros.push(`${p.fn} ${p.ln} → ${pro}`);st.cash+=1500;st.rep+=10}grads.push(p.ln);removePlayer(p.id)}
  for(const p of sq()){p.year++;p.cond=100}
  st.portal=makePortal(true);for(const p of sq())p.sMins=0;
  const intake=[];const n=Math.min(2+st.fac.recruiting,28-sq().length);
  for(let i=0;i<n;i++){const rar=Math.max(rarRoll(tierOf().rr),R()<.05*st.fac.recruiting?1:0);const p=genPlayer(st.gender,pick(POS_ORDER.concat(['CB','CM','ST'])),rar,{year:1,shift:st.fac.recruiting-1+tierOf().shift});sq().push(p);intake.push(p)}
  assignNums(sq());
  for(const t of st.teams.slice(1)){t.squad=t.squad.filter(p=>p.year<4);t.squad.forEach(p=>{p.year++;p.cond=100;p.rating=Math.min(p.pot,p.rating+ri(0,3))});
    const need=SQUAD_POS.slice();for(const p of t.squad){const i=need.indexOf(p.pos);if(i>=0)need.splice(i,1)}
    for(const pos of need)t.squad.push(genPlayer(st.gender,pos,rarRoll(tierOf().rr),{year:1,shift:t.strength}));assignNums(t.squad)}
  const T=me().tactics;T.lineup=autopick(sq(),T.formation);
  const ko=st.userKO.length?st.userKO.join(' · '):'Did not reach a tournament';
  const confN=st.confChampName,natN=st.natChampName;
  newSeasonFixtures();
  const old=st.season;st.season++;
  st.offers=makeOffers();
  news(`Season ${old} over: finished ${pos}. ${champ.name} ${champ.nick} won the league; ${natN} won The Final Whistle.`);save();render();
  const nextT=JOB_TIERS[st.tier+1];
  setTimeout(()=>tip('grad','End of season: <b>seniors graduate</b>, everyone moves up a class year and new walk-ons arrive. The <b>Transfer Portal</b> is now open for 3 days, so check Recruit → Portal.','elig'),400);
  sheet(`<h2>Season ${old} review</h2><div class="statgrid"><div class="stat"><small>League finish</small><b>${pos} / 10</b></div><div class="stat"><small>Reputation</small><b>${st.rep}</b></div><div class="stat"><small>League rep</small><b>+${repGain}</b></div></div>
   <h3>Postseason</h3><div style="font-size:13px"><b>${esc(ko)}</b><br><span class="mute">Conference Tournament: ${esc(confN||'–')}<br>National champions: ${esc(natN||'–')}</span></div>
   <h3>Graduation · ${grads.length}</h3><div style="font-size:13px">${grads.map(esc).join(', ')||'None'}</div>
   ${pros.length?`<h3>${st.gender==='w'?'Pro signings (free agency)':'Draft Night'}</h3><div style="font-size:13px;color:var(--lime)">${pros.map(esc).join('<br>')}</div><div class="mute" style="font-size:11px">+${money(1500)} and +10 rep each</div>`:''}
   <h3>Transfer Portal · open 3 days</h3><div style="font-size:13px">${st.portal.pool.length} players available (incl. JUCO graduates).${st.portal.leaving.length?` <b style="color:var(--orange)">${st.portal.leaving.map(l=>esc(l.p.ln)).join(', ')} entered the portal.</b> Offer NIL deals in Recruiting → Portal to keep them.`:''}</div>
   <h3>Ink Day · ${intake.length} freshman walk-ons joined ${helpBtn('walkon')}</h3><div class="plist">${intake.map(p=>playerRow(p,'NEW')).join('')}</div>
   ${st.offers.length?`<button class="btn full" style="margin-top:12px;background:var(--green);color:#06210f" data-act="offers">📨 ${st.offers.length} job offer${st.offers.length>1?'s':''}</button>`
     :`<p class="mute" style="font-size:12px;margin-top:12px">${nextT&&nextT.schools.length?`No job offers yet. Reach ${nextT.rep} reputation for ${nextT.n} offers.`:'You are at the top of the college game. Pro jobs arrive in a later build.'}</p><button class="btn full" data-act="closesheet">Start Season ${st.season}</button>`}`);
}
function newSeasonFixtures(){st.fixtures=roundRobin(st.teams.map(t=>t.id).sort(()=>R()-.5)).map(rd=>rd.map(([h,a])=>({h,a,hs:null,as:null})));
  st.round=0;st.last=null;st.phase='regular';st.ko=null;st.natTeams=[];st.userKO=[];st.confChamp=st.leagueChamp=null;st.confChampName=st.natChampName=null}

// =================== JOB OFFERS ===================
function makeOffers(){const el=[];for(let t=st.tier+1;t<JOB_TIERS.length;t++)if(JOB_TIERS[t].schools.length&&st.rep>=JOB_TIERS[t].rep)el.push(t);
  return el.slice(-2).reverse().map(t=>{const T=JOB_TIERS[t];const s=pick(T.schools);return {tier:t,school:s,budget:T.budget,fac:T.fac}})}
function showOffers(){const cur=tierOf();
  sheet(`<h2>Job offers</h2><p class="mute" style="margin-top:-6px;font-size:12px">Athletic directors have called. Take the job and you inherit that program's roster, facilities and budget. You keep your reputation, Gold, Hall of Fame and up to 3 freshmen, who flip their commitment to follow you.</p>
   ${st.offers.map((o,i)=>{const T=JOB_TIERS[o.tier],k=KITS[o.school[3]];return `<div class="card"><div class="row"><span class="crest" style="width:44px;height:44px;background:${k[1]};border-color:${k[2]};color:${k[2]}">${o.school[2]}</span>
     <div class="sp"><b style="font-size:16px">${esc(o.school[0])} ${esc(o.school[1])}</b><br><small class="mute">${T.n} · ${esc(T.conf)}</small></div></div>
     <div class="statgrid" style="margin-top:10px"><div class="stat"><small>Booster budget</small><b>${kfmt(o.budget)}</b></div><div class="stat"><small>Scholarship pool</small><b>~${kfmt((TIER_COA[o.tier][0]+TIER_COA[o.tier][1])/2*TIER_COA[o.tier][2])}</b></div><div class="stat"><small>Facilities</small><b>Lv ${o.fac}</b></div><div class="stat"><small>Squad level</small><b>~${Math.round(36+T.shift)}</b></div></div>
     <button class="btn full" style="margin-top:10px" data-act="acceptjob" data-v="${i}">Accept job</button></div>`}).join('')}
   <button class="btn ghost full" data-act="stayjob">Stay at ${esc(me().name)} (${cur.short})</button>`)}
function acceptJob(i){const o=st.offers[i],T=JOB_TIERS[o.tier],k=KITS[o.school[3]],oldName=me().name;
  const follow=sq().filter(p=>p.year===1).sort((a,b)=>b.pot-a.pot).slice(0,3);
  const user={id:'U',name:o.school[0],nick:o.school[1],short:o.school[2],kit:[k[1],k[2]],user:true};
  user.squad=genSquad(st.gender,T.shift,SQUAD_POS.map(()=>rarRoll(T.rr)));follow.forEach(p=>{p.num=0;p.st={apps:0,goals:0,mins:0};user.squad.push(p)});assignNums(user.squad);
  user.tactics={...me().tactics,lineup:[]};user.tactics.lineup=autopick(user.squad,user.tactics.formation);
  const teams=[user];T.schools.filter(s=>s[0]!==o.school[0]).sort(()=>R()-.5).slice(0,9).forEach((c,j)=>{const sty=BOT_STYLE[j%BOT_STYLE.length],kk=KITS[c[3]];
    const t={id:'B'+j,name:c[0],nick:c[1],short:c[2],kit:[kk[1],kk[2]],style:sty[0],strength:T.shift+ri(-4,4)};
    t.squad=genSquad(st.gender,t.strength,SQUAD_POS.map(()=>rarRoll(T.rr)));t.tactics={formation:sty[1],mentality:sty[2],instr:Array(11).fill(2),lineup:[]};teams.push(t)});
  const tc=TIER_COA[o.tier];st.coa=ri(tc[0]/500,tc[1]/500)*500;st.pool=st.coa*ri(tc[2],tc[3]);assignSchol(user.squad.filter(p=>!follow.includes(p)),st.coa,st.pool*.8);
  st.teams=teams;st.tier=o.tier;st.fac={stadium:T.fac,training:T.fac,medicine:T.fac,recruiting:T.fac,media:T.fac};st.cash=T.budget;st.training=[];st.apps=[];st.offers=[];
  newSeasonFixtures();newApps(3);st.portal=makePortal(false);
  news(`Coach ${st.coach} leaves ${oldName} for ${user.name} ${user.nick} (${T.n}).${follow.length?` ${follow.map(p=>p.ln).join(', ')} follow${follow.length===1?'s':''} the coach.`:''}`);
  save();closeSheet();st.tab='home';render();
  sheet(`<div style="text-align:center"><div style="font-size:40px">🤝</div><h2>Welcome to ${esc(user.name)}</h2><p class="mute">${esc(T.conf)} · ${T.n}</p>
   ${follow.length?`<p style="font-size:13px">${follow.map(p=>esc(p.fn+' '+p.ln)).join(', ')} flipped their commitment to follow you.</p>`:''}</div>
   <button class="btn full" data-act="closesheet">Meet the squad</button>`)}

// =================== APPLICATIONS (players apply to you) ===================
// High-schoolers email coaches with highlight tapes. Better programs get better applicants.
// o: {pools, bonus, vetted (tighter range), scouted, note, tag}
function newApps(n,o={}){for(let i=0;i<n;i++){const r=R()*100,bonus=st.rep/20+st.fac.recruiting*2+(o.bonus||0);
  const rar=r<1+bonus*.2?3:r<6+bonus?2:r<30+bonus*1.5?1:0;
  const p=genPlayer(st.gender,pick(POS_ORDER.concat(['CB','CM','ST'])),rar,{year:1,shift:st.fac.recruiting-1+tierOf().shift,pool:o.pools?pick(o.pools):undefined});
  const lo=p.rating-ri(o.vetted?1:2,o.vetted?3:6),hi=p.rating+ri(o.vetted?1:2,o.vetted?3:6);
  const note=o.note||pick(['Sent a highlight tape','Recommended by their club coach','Emailed after your last match','Spotted at a regional showcase','Her/his family lives nearby']).replace('Her/his',st.gender==='w'?'Her':'His');
  st.apps.push({p,lo,hi,scouted:!!o.scouted,note,ask:askFor(rar),walkon:rar===0&&R()<.6,exp:st.day+3,tag:o.tag||null})}}
function appCard(a,i){const p=a.p;return `<div class="card" style="padding:12px"><div class="row">${numB({num:'?'},me().kit)}<div class="sp"><b>${esc(p.fn)} ${esc(p.ln)}</b> ${a.tag?`<span class="tag r2">${a.tag}</span>`:''}<br><small class="mute">${p.flag} ${esc(p.town)} · ${p.pos} · ${esc(a.note)}</small></div>
  <div style="text-align:right">${a.scouted?`${rtag(p.rar)}<div class="rat" style="width:auto">${p.rating}<small class="mute" style="font-size:11px"> / ${p.pot}</small></div>`:`<span class="tag" style="background:#2a2e36">? stars</span><div class="rat" style="width:auto;font-size:13px">${a.lo}–${a.hi}</div>`}</div></div>
  <div class="row" style="gap:6px;margin-top:10px">${a.scouted?'':`<button class="btn sec sm" data-act="scout" data-v="${i}">Scout ${money(200)}</button><button class="btn ghost sm" data-act="adscout" data-v="${i}">▶ Scout (ad)</button>`}
   <span class="sp"></span><button class="btn ghost sm" data-act="decline" data-v="${i}">Pass</button><button class="btn sm" data-act="offer" data-v="${i}">Make offer</button></div>
  <div style="font-size:11px;margin-top:6px" class="mute">🎓 Hopes for ${a.ask?`~${Math.round(a.ask*100)}% scholarship (${money(schAmt(a.ask))}/yr)`:'a walk-on spot'}</div>
  <small class="mute" style="font-size:10px">Expires in ${a.exp-st.day} day${a.exp-st.day>1?'s':''}</small></div>`}

// =================== RECRUIT TAB ===================
function viewRecruit(v){const t=st.rtab||'inbox';
  const tabs=[['inbox',`Inbox${st.apps.length?' '+st.apps.length:''}`],['scout','Scouting'],['camp','ID Camp'],['portal',portalOpen()?'Portal ●':'Portal'],['packs','Packs']];
  v.innerHTML=`<div class="row"><h2 class="sp">Recruiting</h2><span class="chip">Roster ${sq().length}/28</span></div>
   <div class="seg" style="margin-bottom:12px">${tabs.map(([k,n])=>`<button data-act="rtab" data-v="${k}" class="${t===k?'on':''}" style="${k==='portal'&&portalOpen()?'color:var(--lime)':''}">${n}</button>`).join('')}</div><div id="rv"></div>`;
  ({inbox:rInbox,scout:rScout,camp:rCamp,portal:rPortal,packs:viewPacks})[t]($('#rv'));}
function rInbox(v){tip('inbox','Each applicant tells you roughly what scholarship they hope for. Offer what they ask and they\'ll very likely say yes. Offer less (or a walk-on spot) and it\'s a gamble. Don\'t spend your whole pool on one player!','schol');v.innerHTML=`<button class="btn sm" style="float:right;margin:0 0 8px 8px;background:#b45309" data-act="refreshapps">New applicants ◆40</button><p class="mute" style="margin-top:0;font-size:12px">Players who want to play for you: emails, highlight tapes, camp attendees, agency and scouting reports. Scout to reveal their true level, then offer a scholarship. Applications expire after 3 days.</p>
  ${st.apps.length?st.apps.map(appCard).join(''):'<p class="mute">No applications right now. Win matches, host an ID camp or send scouts out to find more.</p>'}`}
const AGENCIES=[['Pitch Passport','UK & Europe trials',['eng','ger','swe','esp','fra']],['Golden Boot Placements','West Africa & Caribbean trials',['yor','igb','gha','jam']],['Samba Scholars','Brazil & Mexico trials',['bra','mex']],['Rising Sun Sports','Japan & Korea trials',['jpn','kor']]];
const US_POOLS=['us','us','us_hisp','us_irish','us_ital','us_mw'];
const YOUTH=[['Elite Youth League','Top club teams nationwide'],['NextUp Academy League','Elite academy teams (the pro clubs scout here too)'],['State Cup Finals','Best teams from your region']];
const agencyFee=()=>600+(st.tier||0)*600,youthFee=i=>[900,1200,500][i]+(st.tier||0)*700;
const tripReady=()=>st.day-st.agencyDay>=3;
function rScout(v){const cd=tripReady()?'One scouting trip every 3 days.':`Next trip in ${3-(st.day-st.agencyDay)} day(s). <button class="btn sm" style="background:#b45309" data-act="skipscout">Skip ◆50</button>`;
  v.innerHTML=`<div class="card" style="background:linear-gradient(150deg,#1d2a4a,#17191e 70%)"><b>🌍 International agencies</b><p class="mute" style="font-size:12px;margin:4px 0 8px">Placement agencies run trials abroad and pitch their players to US college coaches. Request a showcase and they send 3 vetted profiles. ${cd}</p>
   ${AGENCIES.map((g,i)=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><div class="sp"><b style="font-size:13px">${g[0]}</b><br><small class="mute">${g[1]}</small></div><button class="btn sm" data-act="agency" data-v="${i}" ${tripReady()?'':'disabled'}>${money(agencyFee())}</button></div>`).join('')}</div>
   <div class="card" style="background:linear-gradient(150deg,#1d3b2a,#17191e 70%)"><b>🇺🇸 Youth league scouting</b><p class="mute" style="font-size:12px;margin:4px 0 8px">Send your staff to elite youth leagues. You get 2 fully scouted domestic prospects with higher potential. ${cd}</p>
   ${YOUTH.map((g,i)=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><div class="sp"><b style="font-size:13px">${g[0]}</b><br><small class="mute">${g[1]}</small></div><button class="btn sm" data-act="youth" data-v="${i}" ${tripReady()?'':'disabled'}>${money(youthFee(i))}</button></div>`).join('')}</div>`}

// ---------- ID camp ----------
const campCost=()=>400+(st.tier||0)*400;
const campSize=()=>Math.round(20+st.fac.stadium*10+st.rep/10);
function rCamp(v){const c=st.camp;const busy=c&&!c.paid;const cool=c&&c.paid&&st.day<c.done+3;
  v.innerHTML=`<div class="card"><b>⛺ Host an ID camp</b><p class="mute" style="font-size:12px;margin:4px 0 10px">Programs run paid identification camps to see prospects up close. Campers pay to attend, so a camp usually <b>earns</b> money, and the best campers apply to you with a reliable scouting report. Runs for 2 days alongside your matches.</p>
   <div class="statgrid"><div class="stat"><small>Setup cost</small><b>${money(campCost())}</b></div><div class="stat"><small>Expected campers</small><b>~${campSize()}</b></div><div class="stat"><small>Standouts</small><b>${3+Math.floor(st.fac.recruiting/2)}</b></div></div>
   <p class="mute" style="font-size:11px">Camp size grows with your Stadium level and reputation. Fee $40 per camper.</p>
   ${busy?`<div class="card" style="background:var(--panel2);margin:0">⏳ Camp in progress: ${c.size} campers. Finishes in ${Math.max(1,c.done-st.day)} day(s).</div>`
    :cool?`<button class="btn full" disabled>Next camp in ${c.done+3-st.day} day(s)</button>`:`<button class="btn full" data-act="camp">Host camp · ${money(campCost())}</button>`}</div>
   ${c&&c.paid&&c.report?`<div class="card"><b>Last camp</b><div class="mute" style="font-size:12px;margin-top:4px">${esc(c.report)}</div></div>`:''}`}
function dailyTicks(){const out=[];const c=st.camp;
  if(c&&!c.paid&&st.day>=c.done){const inc=c.size*40;st.cash+=inc;const n=3+Math.floor(st.fac.recruiting/2);
    newApps(n,{pools:US_POOLS,vetted:true,scouted:R()<.5,note:'Standout at your ID camp',tag:'Camp',bonus:2});
    c.paid=true;c.report=`${c.size} campers · ${money(inc)} in fees · ${n} standouts invited to apply`;out.push(`⛺ ID camp finished: ${c.report}.`);news(`ID camp finished: ${c.report}`)}
  if(st.portal&&!st.portal.closed&&st.day>=st.portal.until){st.portal.closed=true;const gone=st.portal.leaving.filter(l=>!l.kept);
    for(const l of gone)removePlayer(l.p.id);if(gone.length){const t=`Transfer Portal closed. ${gone.map(l=>l.p.ln).join(', ')} left the program.`;out.push('🚪 '+t);news(t)}else out.push('🚪 Transfer Portal closed.')}
  return out}

// ---------- Transfer Portal + JUCO ----------
const PORTAL_REASONS=['Seeking more playing time','Coach left their school','Wants to be closer to home','Looking for a bigger stage','Program cut its budget','Wants a better NIL deal'];
const portalOpen=()=>st.portal&&!st.portal.closed&&st.day<st.portal.until;
function makePortal(withLeavers){const T=tierOf(),pool=[];
  for(let i=0;i<6;i++){const rar=Math.min(4,rarRoll(T.rr)+(R()<.35?1:0));const p=genPlayer(st.gender,pick(POS_ORDER.concat(['CB','CM','ST'])),rar,{year:ri(2,3),shift:T.shift+ri(0,4)});
    p.pot=Math.max(p.rating+1,p.pot-ri(2,5));
    pool.push({p,reason:pick(PORTAL_REASONS),interest:clamp(Math.round(55+st.rep/40-rar*8+ri(-15,15)),10,95),ask:askFor(rar),juco:false})}
  for(let i=0;i<4;i++){const rar=R()<.25?1:0;const p=genPlayer(st.gender,pick(POS_ORDER.concat(['CB','CM','ST'])),rar,{year:3,shift:T.shift+ri(4,8)});
    p.pot=p.rating+ri(2,6);
    pool.push({p,reason:'Junior-college graduate · 2 years of eligibility left',interest:clamp(Math.round(80+st.rep/60+ri(-10,10)),40,98),ask:Math.round(askFor(rar)*.8*20)/20,juco:true})}
  const leaving=[];
  if(withLeavers){const s=sq().filter(p=>p.year<=4);const med=[...s].map(p=>p.rating).sort((a,b)=>a-b)[Math.floor(s.length/2)]||0;

   case 'acceptjob':acceptJob(+v);break;
   case 'stayjob':st.offers=[];st.rep+=10;news(`Coach ${st.coach} turned down offers to stay at ${me().name}.`);save();closeSheet();render();toast('Loyalty noted. Boosters are delighted (+10 rep)');break;
   case 'scout':{const a=st.apps[+v];if(st.cash<200){toast('Not enough Booster $');break}st.cash-=200;a.scouted=true;save();render();break}
   case 'adscout':{const a=st.apps[+v];watchAd('Scout report on '+a.p.ln,()=>{a.scouted=true;render()});break}
   case 'decline':st.apps.splice(+v,1);save();render();break;
   case 'offer':showOffer(+v);break;
   case 'offerOLD':{const a=st.apps[+v];if(sq().length>=28){toast('Roster full (28)');break}if(st.cash<a.cost){toast('Not enough Booster $ for the scholarship');break}
     st.cash-=a.cost;sq().push(a.p);assignNums(sq());st.apps.splice(+v,1);news(`${a.p.fn} ${a.p.ln} (${a.p.pos}) accepted a scholarship`);save();render();toast(`${a.p.ln} signed!`);break}
   case 'addouble':{const amt=+v;watchAd('+'+money(amt),()=>{st.cash+=amt;render()});t.remove();break}
   case 'adpack':{if(st.freePack===st.day){toast('Free pack already claimed today');break}if(sq().length>=28){toast('Roster full (28)');break}
     watchAd('Free Showcase Pack',()=>{st.freePack=st.day;st.cash+=PACKS.std.price;buyPack('std')});break}
   case 'adphysio':watchAd('Physio session: +15% condition',()=>{showPhysio()});break;
   case 'physio':{const p=P(v);p.cond=Math.min(100,p.cond+15);save();closeSheet();render();toast(`${p.ln} → ${Math.round(p.cond)}%`);break}
   case 'testbuy':testBuy(v);break;
   case 'dobuy':doBuy(v);break;
   case 'claim':claimPass(v);break;
   case 'pattern':me().kit[2]=v;save();render();break;
   case 'buypattern':if(spendGold(PATTERNS[v][1],PATTERNS[v][0]+' kit')){st.owned.push(v);me().kit[2]=v;save();render();toast(PATTERNS[v][0]+' kit unlocked')}break;
   case 'recolour':showRecolour();break;
   case 'dorecolour':if(spendGold(RECOLOUR,'new club colours')){const k=KITS[+v],pt=me().kit[2];me().kit=[k[1],k[2],pt];save();closeSheet();render();toast('New colours: '+k[0])}break;
   case 'skipscout':if(spendGold(50,'skip scouting wait')){st.agencyDay=st.day-3;save();render()}break;
   case 'refreshapps':if(spendGold(40,'new applicants')){newApps(3);save();render();toast('3 new applications')}break;
   case 'recover':{const p=P(v);if(spendGold(30,'full recovery for '+p.ln)){p.cond=100;save();closeSheet();render();toast(p.ln+' fully recovered')}break}
   case 'closesheet':closeSheet();break;
   case 'seasonend':seasonEnd();break;
   case 'mment':if(MX){MX.m.sides[0].mentality=+v;me().tactics.mentality=+v;document.querySelectorAll('#mMent button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}break;
   case 'mspeed':if(MX){MX.speed=+v;document.querySelectorAll('#mSpeed button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}break;
   case 'mskip':if(MX)skipLive();break;
   case 'httac':openHTTactics();break;
   case 'htdone':applyHT();break;
   case 'htgo':if(tacCtx)applyHT();resumeHT();break;
  }
});
function openHTTacticsKeep(){openHTTactics()}
function showPhysio(){const L=[...sq()].sort((a,b)=>a.cond-b.cond);sheet(`<h2>Physio session</h2><p class="mute" style="margin-top:-6px">Choose a player to get +15% condition.</p><div class="plist">${L.map(p=>playerRow(p,'','physio')).join('')}</div>`)}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.actChange==='focus'){const tr=st.training.find(x=>x.id===t.dataset.v);if(tr){tr.focus=t.value;save()}}});

load();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
